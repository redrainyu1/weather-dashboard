name: weather-cron

on:
  schedule:
    - cron: '5,35 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: weather-fetch
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install httpx beautifulsoup4 flask python-dotenv lxml
      - name: Run serve.py
        env:
          PROXY_URL: ''
        run: python serve.py
      - name: Run accuracy.py
        env:
          PROXY_URL: ''
        run: |
          python accuracy.py --out accuracy.json || echo "acc failed"
          python accuracy.py --period 6-12 --out accuracy_morning.json || echo "acc-morning failed"
      - name: Cleanup history
        run: python cleanup_history.py
      - name: Commit data
        run: |
          git config user.name "weather-bot"
          git config user.email "weather-bot@users.noreply.github.com"
          git add history data.json accuracy.json accuracy_morning.json
          git diff --cached --quiet || git commit -m "auto: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main || true
          git push